name: Run Tests
on:
  push:
    branches:
      - 'main'
      - 'development'
  pull_request:
    branches:
      - 'main'
      - 'development'
  workflow_dispatch:
jobs:
  build:
    name: Build, lint, and test on Node ${{ matrix.node-version }} and ${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macOS-latest, ubuntu-latest]
        node-version: ['20', '22', '24']

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm set registry https://registry.npmjs.org/
          npm ci

      - name: Check formatting
        run: npm run pretty:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --coverage=true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: Run integration test using keria:${{ matrix.keria-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest']
        keria-version: ['0.4.0', 'main']
        node-version: ['20']
    env:
      KERIA_IMAGE_TAG: ${{ matrix.keria-version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Checkout KERIA main integration baseline
        if: matrix.keria-version == 'main'
        uses: actions/checkout@v4
        with:
          repository: WebOfTrust/keria
          ref: 86e21cbdf98dcc75817e16708879c3c5a9b41cb8
          path: .keria-integration
      - name: Build KERIA main integration image
        if: matrix.keria-version == 'main'
        run: docker build --tag weboftrust/keria:main --file .keria-integration/images/keria.dockerfile .keria-integration
      - name: Print docker compose config
        run: docker compose config
      - name: Start released dependencies
        if: matrix.keria-version == '0.4.0'
        run: docker compose up --wait --pull always
      - name: Start KERIA main dependencies
        if: matrix.keria-version == 'main'
        run: docker compose up --wait
      - name: Run KERIA 0.4.0-compatible integration tests
        if: matrix.keria-version == '0.4.0'
        run: npm run test:integration -- --exclude '**/delegation-multisig.test.ts'
      - name: Run integration test
        if: matrix.keria-version != '0.4.0'
        run: npm run test:integration
      - name: Print logs
        run: docker compose logs
        if: always()
